events { worker_connections 1024; }
http {
  # Docker DNS updates these peers when Compose recreates a container.
  resolver 127.0.0.11 valid=5s ipv6=off;
  upstream campus_api {
    zone campus_api 64k;
    server api:8000 resolve;
  }
  upstream campus_web {
    zone campus_web 64k;
    server web:80 resolve;
  }
  server {
    listen 80;
    client_max_body_size 21m;
    location /api/ {
      proxy_pass http://campus_api;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_buffering off;
      proxy_read_timeout 180s;
    }
    location / { proxy_pass http://campus_web; }
  }
}
